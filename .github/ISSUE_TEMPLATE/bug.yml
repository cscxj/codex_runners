name: Bug report
description: Report a reproducible Codex Runners problem
body:
  - type: input
    id: version
    attributes:
      label: Plugin version
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Codex and operating-system version
    validations:
      required: true
  - type: dropdown
    id: provider
    attributes:
      label: Provider
      options: [GitHub, GitLab, Both, Not applicable]
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Remove credentials and private repository details.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
